plugins {
    id 'java'
    id 'com.github.node-gradle.node' version '7.1.0'
}

def cdaGuiViteMode = providers.gradleProperty('cdaGuiMode')
        .orElse(providers.environmentVariable('CDA_GUI_MODE'))
        .orElse('production')

task buildGuiVite(type:NpxTask) {
    dependsOn npmInstall
    command = "vite"
    args = ["build", "--mode", cdaGuiViteMode.get()]
    inputs.files('package.json', 'package-lock.json', 'vite.config.js', 'index.html',
            '.env.development', '.env.production', '.env.test')
    inputs.dir('src')
    inputs.dir('public')
    inputs.dir(fileTree("node_modules").exclude(".cache"))
    outputs.dir('dist')
}

task buildGuiSitemap(type: Exec) {
    dependsOn buildGuiVite
    executable "node"
    args "scripts/generate-sitemap.mjs"
    workingDir project.layout.projectDirectory
    inputs.dir('scripts')
    inputs.files('src/route-paths.js')
    outputs.file('dist/sitemap.xml')
}

task buildGui {
    dependsOn buildGuiSitemap
}

task cleanNode(type: Delete) {
    delete project.layout.projectDirectory.dir('dist')
    delete project.layout.projectDirectory.dir('node_modules')
}

build.dependsOn buildGui
clean.dependsOn cleanNode


task runGuiDev(type: Exec) {
    dependsOn npmInstall
    executable "npm"
    args  "run", "dev"
    workingDir project.layout.projectDirectory
}

sourceSets {
    java {
        main {
            resources {
                // This makes the processResources task automatically depend on the buildWebapp one
                srcDir(buildGui)
            }
        }
    }
}
