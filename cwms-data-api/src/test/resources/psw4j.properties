# Test-only Argon2 settings. Deliberately cheap: every authenticated request in the
# integration tests verifies an API key, and production-strength parameters cost ~180ms each.
# Shadows src/main/resources/psw4j.properties on the test classpath. Never use in production.
hash.argon2.type=id
hash.argon2.version=19
hash.argon2.memory=1024
hash.argon2.iterations=1
hash.argon2.parallelism=1
hash.argon2.length=32
