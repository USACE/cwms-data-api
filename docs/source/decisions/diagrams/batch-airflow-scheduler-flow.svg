<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Airflow scheduled Batch Events flow</title>
  <desc id="desc">Airflow polls Batch Events scheduled scripts per office, obtains scheduler service-account tokens, triggers due scripts, and lets Batch Events own dispatch, status, logs, and CDA runner authentication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.6;rx:10}
      .air{fill:#f5f3ff;stroke:#7c3aed}
      .auth{fill:#ecfeff;stroke:#0891b2}
      .api{fill:#f0fdf4;stroke:#16a34a}
      .run{fill:#fff7ed;stroke:#ea580c}
      .cda{fill:#eff6ff;stroke:#2563eb}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:15px}
      .small{font-size:12px;fill:#475569}
      .title{font-size:22px;font-weight:700}
      .step{font-size:13px;font-weight:700;fill:#334155}
      .arrow{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="32" y="40" class="text title">Airflow Scheduled Flow</text>
  <text x="32" y="64" class="text small">One registry-driven scheduler can serve many offices without one DAG per script or one AWS Batch job definition per office.</text>

  <rect x="52" y="120" width="225" height="96" class="box air"/>
  <text x="72" y="146" class="step">1. Every-minute DAG</text>
  <text x="72" y="174" class="text">Registry scheduler runs</text>
  <text x="72" y="196" class="text small">optionally loops configured offices</text>

  <rect x="332" y="120" width="225" height="96" class="box auth"/>
  <text x="352" y="146" class="step">2. Scheduler token</text>
  <text x="352" y="174" class="text">client_credentials</text>
  <text x="352" y="196" class="text small">cwms-batch-airflow-&lt;office&gt;</text>

  <rect x="612" y="120" width="245" height="96" class="box api"/>
  <text x="632" y="146" class="step">3. List due scripts</text>
  <text x="632" y="174" class="text">GET /scripts/scheduled</text>
  <text x="632" y="196" class="text small">Batch Events filters by office roles</text>

  <rect x="612" y="285" width="245" height="110" class="box api"/>
  <text x="632" y="311" class="step">4. Timezone due check</text>
  <text x="632" y="339" class="text">hourly minute or cron</text>
  <text x="632" y="361" class="text small">scheduleTimezone controls local time;</text>
  <text x="632" y="379" class="text small">DST gaps skipped, repeats run once</text>

  <rect x="332" y="285" width="225" height="110" class="box api"/>
  <text x="352" y="311" class="step">5. Trigger due rows</text>
  <text x="352" y="339" class="text">POST /jobs per script</text>
  <text x="352" y="361" class="text small">does not wait for AWS Batch</text>
  <text x="352" y="379" class="text small">one office failure does not block others</text>

  <rect x="52" y="285" width="225" height="110" class="box api"/>
  <text x="72" y="311" class="step">6. Registry job record</text>
  <text x="72" y="339" class="text">Jobs DB + queue</text>
  <text x="72" y="361" class="text small">runtime, resources, timeout,</text>
  <text x="72" y="379" class="text small">env vars copied from script row</text>

  <rect x="52" y="470" width="225" height="96" class="box run"/>
  <text x="72" y="496" class="step">7. Shared runtime</text>
  <text x="72" y="524" class="text">Dispatcher submits job</text>
  <text x="72" y="546" class="text small">runtime job definition + overrides</text>

  <rect x="332" y="470" width="225" height="96" class="box run"/>
  <text x="352" y="496" class="step">8. Runner bootstraps</text>
  <text x="352" y="524" class="text">Fetches brokered env</text>
  <text x="352" y="546" class="text small">office runner client credentials</text>

  <rect x="612" y="470" width="245" height="96" class="box auth"/>
  <text x="632" y="496" class="step">9. Runner token</text>
  <text x="632" y="524" class="text">client_credentials</text>
  <text x="632" y="546" class="text small">machine_auth + signed context</text>

  <rect x="902" y="470" width="175" height="96" class="box cda"/>
  <text x="922" y="496" class="step">10. CDA call</text>
  <text x="922" y="524" class="text">CDA validates token</text>
  <text x="922" y="546" class="text small">then normal DB roles</text>

  <path d="M277 168 H332" class="arrow"/>
  <path d="M557 168 H612" class="arrow"/>
  <path d="M735 216 V285" class="arrow"/>
  <path d="M612 340 H557" class="arrow"/>
  <path d="M332 340 H277" class="arrow"/>
  <path d="M165 395 V470" class="arrow"/>
  <path d="M277 518 H332" class="arrow"/>
  <path d="M557 518 H612" class="arrow"/>
  <path d="M857 518 H902" class="arrow"/>
</svg>
