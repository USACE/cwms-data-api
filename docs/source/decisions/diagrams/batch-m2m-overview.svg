<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" role="img" aria-labelledby="title desc">
  <title id="title">CWMS Batch M2M overview</title>
  <desc id="desc">Airflow and users submit jobs through Batch Events. Batch Events records the job, dispatches a shared runtime, brokers environment and secrets, and the runner uses an office-scoped Keycloak service account to call CDA.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.6;rx:10}
      .identity{fill:#ecfeff;stroke:#0891b2}
      .registry{fill:#f0fdf4;stroke:#16a34a}
      .runtime{fill:#fff7ed;stroke:#ea580c}
      .cda{fill:#eff6ff;stroke:#2563eb}
      .secret{fill:#fdf2f8;stroke:#db2777}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:15px}
      .small{font-size:12px;fill:#475569}
      .title{font-size:22px;font-weight:700}
      .laneTitle{font-size:15px;font-weight:700;fill:#334155}
      .arrow{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="690" fill="#ffffff"/>
  <text x="30" y="38" class="text title">CWMS Batch M2M Auth and Shared Runtime</text>
  <text x="30" y="62" class="text small">Scheduler identity requests jobs; runner identity calls CDA. Batch Events owns registry, dispatch, runtime env broker, logs, and office-scoped authorization.</text>

  <rect x="25" y="88" width="170" height="540" class="lane"/>
  <text x="45" y="116" class="text laneTitle">Requesters</text>
  <rect x="45" y="145" width="130" height="78" class="box"/>
  <text x="65" y="177" class="text">Web UI user</text>
  <text x="65" y="198" class="text small">PKCE login</text>
  <rect x="45" y="265" width="130" height="88" class="box"/>
  <text x="65" y="296" class="text">Airflow</text>
  <text x="65" y="317" class="text small">per-office</text>
  <text x="65" y="335" class="text small">scheduler client</text>

  <rect x="225" y="88" width="170" height="540" class="lane"/>
  <text x="245" y="116" class="text laneTitle">Keycloak</text>
  <rect x="245" y="145" width="130" height="90" class="box identity"/>
  <text x="266" y="177" class="text">User token</text>
  <text x="266" y="198" class="text small">roles + offices</text>
  <rect x="245" y="265" width="130" height="90" class="box identity"/>
  <text x="266" y="296" class="text">Scheduler</text>
  <text x="266" y="317" class="text small">cwms-batch-</text>
  <text x="266" y="335" class="text small">airflow-swt</text>
  <rect x="245" y="458" width="130" height="100" class="box identity"/>
  <text x="266" y="490" class="text">Runner token</text>
  <text x="266" y="511" class="text small">machine_auth</text>
  <text x="266" y="529" class="text small">run_as_office</text>

  <rect x="425" y="88" width="245" height="540" class="lane"/>
  <text x="445" y="116" class="text laneTitle">Batch Events</text>
  <rect x="455" y="145" width="180" height="90" class="box registry"/>
  <text x="482" y="177" class="text">Registry API</text>
  <text x="482" y="198" class="text small">scripts, schedules,</text>
  <text x="482" y="216" class="text small">timeouts, resources</text>
  <rect x="455" y="275" width="180" height="90" class="box registry"/>
  <text x="482" y="307" class="text">Jobs DB + queue</text>
  <text x="482" y="328" class="text small">office-scoped jobs</text>
  <text x="482" y="346" class="text small">status + log lookup</text>
  <rect x="455" y="405" width="180" height="82" class="box registry"/>
  <text x="482" y="438" class="text">Dispatcher</text>
  <text x="482" y="459" class="text small">shared runtime map</text>
  <rect x="455" y="525" width="180" height="72" class="box registry"/>
  <text x="482" y="555" class="text">Runtime broker</text>
  <text x="482" y="576" class="text small">job env + secrets</text>

  <rect x="705" y="88" width="180" height="540" class="lane"/>
  <text x="725" y="116" class="text laneTitle">Runtime</text>
  <rect x="725" y="405" width="140" height="82" class="box runtime"/>
  <text x="747" y="438" class="text">AWS Batch</text>
  <text x="747" y="459" class="text small">one job def per</text>
  <text x="747" y="477" class="text small">runtime</text>
  <rect x="725" y="525" width="140" height="82" class="box runtime"/>
  <text x="747" y="555" class="text">Runner image</text>
  <text x="747" y="576" class="text small">executes script</text>

  <rect x="915" y="88" width="225" height="540" class="lane"/>
  <text x="935" y="116" class="text laneTitle">CDA + Data</text>
  <rect x="945" y="230" width="165" height="82" class="box secret"/>
  <text x="970" y="262" class="text">Office secrets</text>
  <text x="970" y="283" class="text small">runner client creds</text>
  <rect x="945" y="458" width="165" height="92" class="box cda"/>
  <text x="970" y="490" class="text">CWMS Data API</text>
  <text x="970" y="511" class="text small">validates OIDC</text>
  <text x="970" y="529" class="text small">registered machine</text>
  <rect x="945" y="575" width="165" height="52" class="box cda"/>
  <text x="970" y="606" class="text">CWMS DB roles</text>

  <path d="M175 184 H245" class="arrow"/>
  <path d="M175 309 H245" class="arrow"/>
  <path d="M375 310 H455" class="arrow"/>
  <path d="M175 190 C300 190 320 190 455 190" class="arrow"/>
  <path d="M545 235 V275" class="arrow"/>
  <path d="M545 365 V405" class="arrow"/>
  <path d="M635 446 H725" class="arrow"/>
  <path d="M795 487 V525" class="arrow"/>
  <path d="M725 566 H635" class="arrow"/>
  <path d="M635 561 H945 C925 561 925 271 945 271" class="arrow"/>
  <path d="M865 566 C895 566 895 508 945 508" class="arrow"/>
  <path d="M865 548 C900 548 900 508 945 508" class="arrow"/>
  <path d="M1110 504 C1140 504 1140 601 1110 601" class="arrow"/>
  <path d="M375 508 H725" class="arrow"/>
  <text x="390" y="500" class="text small">client_credentials</text>
</svg>
