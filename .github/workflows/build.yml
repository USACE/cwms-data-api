---
name: Build And Test CWMS Data API
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
    jdk: 17

jobs:
  # Compile once
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: Clean up disk space, so we don't run out.
        uses: ./.github/actions/clean-disk-space
      - name: setup java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{env.jdk}}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
      - name: build and test
        id: thebuild
        run: ./gradlew clean test --info --init-script init.gradle -x integrationtest
      - name: Upload Test Reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-report-compile-${{ env.jdk }}
          path: |
            ./**/build/reports/tests/**
            ./**/build/test-results/**
          if-no-files-found: error
      - name: Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          annotate_only: true
          include_passed: true
          report_paths: '**/TEST-*.xml'
          detailed_summary: true

  integration-tests:
    needs: compile
    name: integration tests for schema ${{matrix.schema.env}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # place holder for now and leaving commented but in place. General scheme target tests again the current release, the next release, the previous release, and latest development.
        # at this time every possible instance of concern is on 25.07.01, once 26.02.17 is finalized it becomes release and 25.07.01 becomes previous.
        # next-release will be comment out until such time as a RC gets made
        schema:
          - env: latest
            image: "ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:latest-dev"
          - env: release
            image: "ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:26.02.17"
          - env: next-release
            image: "ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:26.07.16-RC02"
          - env: previous
            image: "ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:25.07.01"
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: cleanup
        uses: ./github/actions/clean-disk-space
      - name: setup java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{env.jdk}}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          dependency-graph: generate-and-submit
          # Force a cache write from this job so downstream test jobs can restore
          # ~/.gradle/caches/modules-2 and caches/<gradle-version>/transforms-* on PR
          # branches. Without this, setup-gradle defaults to read-only on non-default
          # branches and every downstream job re-downloads plugins and re-runs the
          # InstrumentationAnalysisTransform passes.
          cache-read-only: false
      - name: Enable Gradle build cache for CI
        # Writes org.gradle.caching=true into the runner's $GRADLE_USER_HOME so task
        # outputs are stored in the local build cache, which the cache step below
        # persists between jobs via the GitHub Actions cache.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
      - name: Share Gradle build cache across jobs
        # Persists ~/.gradle/caches/build-cache-1 under a workflow-run-scoped key so
        # downstream jobs (ubuntu-tests, integration-db engines) restore the entries
        # produced here. Cache keys are content-addressed by Gradle, so reusing across
        # PRs is safe — changed sources get new keys and recompile automatically.
        uses: actions/cache@v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-${{ github.run_id }}-
            gradle-build-cache-${{ runner.os }}-
      - name: integration tests   
        run: ./gradlew integrationtest --info --init-script init.gradle -PCDA.oracle.database.image=${{matrix.schema.image}}
      - name: Create matrix job badge
        if: success() || failure() # always run even if the previous step fails
        uses: ./.github/actions/badge
        with:
          label: 'Build'
          status: ${{ job.status == 'success' && 'Pass' || 'Fail' }}
          file: ${{ matrix.jdk }}/${{ matrix.schema.env }}.svg
          run_id: ${{ github.run_id }}
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: coverage
        id: coverage
        run: |
          # combine the test and integration test reports.
          ./gradlew codeCoverageReport --info --init-script init.gradle -PCDA.oracle.database.image=${{matrix.schema.image}}
          # calculate coverage percentage
          MISSED_LINES=`xmllint --xpath "string(/report/counter[@type='COMPLEXITY']/@missed)"   cwms-data-api/build/reports/jacoco-composite.xml`
          COVERED_LINES=`xmllint --xpath "string(/report/counter[@type='COMPLEXITY']/@covered)" cwms-data-api/build/reports/jacoco-composite.xml`
          PERCENT=`echo "scale=1; (${COVERED_LINES} / (${COVERED_LINES} + ${MISSED_LINES})) * 100" | bc`
          echo "Coverage from missed $MISSED_LINES and covered $COVERED_LINES is $PRECENT"
          echo "coverage=$PERCENT %" >> $GITHUB_OUTPUT
      - name: Create matrix coverage badge
        if: success() || failure() # always run even if the previous step fails
        uses: ./.github/actions/badge
        with:
          label: 'Coverage'
          status: ${{ steps.coverage.outputs.coverage }}
          file: ${{ env.jdk }}/${{ matrix.schema.env }}-coverage.svg
          run_id: ${{ github.run_id }}
      - name: Upload Test Reports - ${{ matrix.jdk }}
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-report-${{ env.jdk }}-${{matrix.schema.env}}
          path: |
            ./**/build/reports/tests/**
            ./**/build/test-results/**
          if-no-files-found: error
      - name: Test Report - ${{ matrix.schema.env }}
        uses: mikepenz/action-junit-report@v6.4.1
        if: always()
        with:
          annotate_only: true
          include_passed: true
          report_paths: '**/TEST-*.xml'
          detailed_summary: true
  open-api-static-analysis:
    name: OpenApi Static Analysis Tests
    runs-on: ubuntu-latest
    env:
      OPEN_API_TEST: "true"
    steps:
      - name: checkout code
        uses: actions/checkout@v5.0.0
      - name: setup java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'
      - name: build and test
        id: thebuild
        run: ./gradlew clean :cwms-data-api:test --tests "cwms.cda.api.OpenApiDocTest" --info --init-script init.gradle
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.4.1
        if: always()
        with:
          annotate_only: true
          include_passed: true
          report_paths: '**/TEST-*.xml'
          detailed_summary: true
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5.0.0
      - name: Build docker image
        run: docker build -t cda:build-latest .
  build-schema-migration-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5.0.0
      # No uploads, we're just verifying that nothing broke the docker image.
      - name: Build Migration image
        uses: ./.github/actions/database-migration-image
        with:
          base-image: ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/schema_installer
          # TODO get current target image from build information
          tag: latest-dev



  badges:
    needs: build
    runs-on: ubuntu-latest
    # we are reporing build state so always run, but only on builds on the main branch
    if: always() && (github.ref_name == 'develop')
    steps:
      - name: Badge Branch
        uses: actions/checkout@v5.0.0
        with:
          ref: badges
          fetch-depth: 1
      - name: Download badges
        uses: actions/download-artifact@v4
        with:
          pattern: badges_${{ github.run_id }}_*
          path: ./build  # directory to download artifacts into
          merge-multiple: true  # downloaded artifacts will be in the same directory specified by path
      - name: Apply Badge
        run: |
          find . -type f
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add build/**/*.svg
          git status
          git commit --allow-empty -m "Update Badge for build of ${{ github.sha }}"
          git push origin badges -f
