---
name: Tagged Release
on:
  push:
    tags:
      # addition prod as a prefix is to allow tagging
      # dated release on the test branch as that's what was
      # actually tested. branches will eventually get
      # renamed to something that makes sense.
      - 'prod-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      # mark as test allow additional releases within a day with
      # a marker after test.
      - 'prod-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[a-z]*'
jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      registry: ${{ secrets.HEC_PUB_REGISTRY}}
      registry_user: ${{ secrets.ALT_REG_USER }}
      registry_password: ${{ secrets.ALT_REG_PASSWORD }}
    with:
      branch: ${{github.ref_name}}
      nightly: false
