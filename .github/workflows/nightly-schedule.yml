name: Nightly Releases - Schedule
on:
  schedule:
    - cron: "3 0 * * *"
  workflow_dispatch:

jobs:
  develop:
    permissions:
      packages: write
      pages: write
      id-token: write
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      branch: "develop"
      nightly: true
  # Deploy CDA nightly. Keeps everyone on their toes with new updates and keeps the containers
  # Updated
  deploy-develop:
    permissions:
      id-token: write
      contents: read
    needs: develop
    environment: Dev
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        uses: usace/cwms-data-api/.github/actions/deploy-cda@develop
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: develop-nightly
          region: ${{secrets.REGION}}
          iam_role: ${{secrets.DEPLOY_ROLE}}
          activation_tag: ${{secrets.ACTIVATION_TAG}}
          activate: true
