name: Nightly Releases - Schedule
on:
  schedule:
    - cron: "3 0 * * *"
  workflow_dispatch:

jobs:
  develop:
    permissions:
      packages: write
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      registry: ${{ secrets.HEC_PUB_REGISTRY}}
      registry_user: ${{ secrets.ALT_REG_USER }}
      registry_password: ${{ secrets.ALT_REG_PASSWORD }}
    with:
      branch: "develop"
      nightly: true
  # Deploy CDA nightly. Keeps everyone on their toes with new updates and keeps the containers
  # Updated
  deploy-develop:
    permissions:
      id-token: write
      contents: read
    needs: develop
    environment: Dev
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        uses: ./.github/actions/deploy-cda@develop
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: develop-nightly
          api_image: ${{needs.develop.outputs.api_image}}
          migration_image: ${{needs.develop.outputs.migration_image}}
          region: ${{env.REGION}}
          iam_role: ${{env.DEPLOY_ROLE}}
          activation_tag: ${{env.ACTIVATION_TAG}}
          activate: true
