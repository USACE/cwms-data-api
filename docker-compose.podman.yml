volumes:
  oracle_data_1:
  auth_data:

networks:
  cwmsdb_net:
    external: true

services:
  # Database is running externally as cwmsdb container
  # Run with: podman run -d --name cwmsdb -e ORACLE_PASSWORD="badSYSpassword" -p 1521:1521 --network cwmsdb_net -v cwmsdb_volume:/opt/oracle/oradata:rw --privileged gvenzl/oracle-free:23.6-full
  db:
    image: ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:latest-dev
    environment:
      #- ORACLE_DATABASE=FREEPDB1
      - ORACLE_PASSWORD=badSYSpassword
      - CWMS_PASSWORD=simplecwmspasswD1
      - OFFICE_ID=HQ
      - OFFICE_EROC=s0
    ports:
      - "1525:1521"
    healthcheck:
      test: ["CMD-SHELL","sqlplus -s -L sys/badSYSpassword@localhost:1521/FREEPDB1 as sysdba <<< 'exit;'"]
      interval: 30s
      timeout: 50s
      retries: 50
      start_period: 40m
    networks:
       cwmsdb_net:
        aliases:
          - cwmsdb


  db_webuser_permissions:
    image: ${CWMS_SCHEMA_INSTALLER_IMAGE:-registry-public.hecdev.net/cwms/schema_installer:latest-dev}
    restart: "no"
    environment:
      - DB_HOST_PORT=cwmsdb:1521
      - DB_NAME=/FREEPDB1
      - CWMS_PASSWORD=simplecwmspasswD1
      - SYS_PASSWORD=badSYSpassword
      - OFFICE_ID=HQ
      - OFFICE_EROC=s0
      - INSTALLONCE=1
      - QUIET=1
      - API_KEY=testkey12345677
    command: >
      sh -xc "sqlplus CWMS_20/$$CWMS_PASSWORD@$$DB_HOST_PORT$$DB_NAME @/setup_sql/users $$OFFICE_EROC $$API_KEY"
    volumes:
      - ./compose_files/sql:/setup_sql:ro
    networks:
      - cwmsdb_net
    depends_on:
      db:
        condition: service_healthy

  data-api:
    container_name: data-api
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      db_webuser_permissions:
        condition: service_completed_successfully
      traefik:
        condition: service_healthy
    image: cwms-rest-api:local-dev
    build:
      target: api
      context: .
      dockerfile: Dockerfile.podman
    command: bash -c "/conf/installcerts.sh && /usr/local/tomcat/bin/catalina.sh run"
    restart: unless-stopped
    ports:
      - "7001:7000"
    expose:
      - 7000
    volumes:
      - ./compose_files/pki/certs:/conf/
      - ./compose_files/tomcat/logging.properties:/usr/local/tomcat/conf/logging.properties:ro
    environment:
      - CDA_JDBC_DRIVER=oracle.jdbc.driver.OracleDriver
      - CDA_JDBC_URL=jdbc:oracle:thin:@cwmsdb/FREEPDB1
      - CDA_JDBC_USERNAME=s0webtest
      - CDA_JDBC_PASSWORD=simplecwmspasswD1
      - CDA_POOL_INIT_SIZE=5
      - CDA_POOL_MAX_ACTIVE=10
      - CDA_POOL_MAX_IDLE=5
      - CDA_POOL_MIN_IDLE=2
      - cwms.dataapi.access.provider=MultipleAccessManager
      - cwms.dataapi.access.providers=KeyAccessManager,OpenID
      - cwms.dataapi.access.openid.create_users=true
      - cwms.dataapi.access.openid.wellKnownUrl=http://auth:${APP_PORT:-8081}/auth/realms/cwms/.well-known/openid-configuration
      - cwms.dataapi.access.openid.altAuthUrl=http://localhost:${APP_PORT:-8081}
      - cwms.dataapi.access.openid.useAltWellKnown=true
      - cwms.dataapi.access.openid.issuer=http://localhost:${APP_PORT:-8081}/auth/realms/cwms
      # Access management toggle - set to true when using authorization proxy
      - cwms.dataapi.access.management.enabled=${CWMS_ACCESS_MGMT_ENABLED:-true}
    healthcheck:
      test: ["CMD","/usr/bin/curl", "-f","localhost:7000/cwms-data/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-api.rule=PathPrefix(`/cwms-data`)"
      - "traefik.http.routers.data-api.entryPoints=web"
    networks:
      - cwmsdb_net

  auth:
    container_name: auth
    image: quay.io/keycloak/keycloak:26.5
    command: ["start-dev", "--import-realm"]
    depends_on:
      traefik:
        condition: service_healthy
    #ports:
    #  - "8080:8080"
    healthcheck:
      test: "/healthcheck.sh"
      interval: 5s
      timeout: 1s
      retries: 100
      start_period: 2s
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_FEATURES=admin-fine-grained-authz
      - KC_HTTP_PORT=${APP_PORT:-8081}
      - KEYCLOAK_FRONTEND_URL=http://localhost:${APP_PORT:-8081}
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY=none
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/auth
      #
      # - KEYCLOAK_ADMIN=admin
      # - KEYCLOAK_ADMIN_PASSWORD=admin
      # - KC_HEALTH_ENABLED=true
      # - KC_FEATURES=admin-fine-grained-authz
      # - KC_HTTP_PORT=8080
      # - KEYCLOAK_FRONTEND_URL=http://localhost:${APP_PORT:-8081}
      # - KC_HOSTNAME=localhost
      # - KC_HOSTNAME_PORT=8080
      # - KC_HOSTNAME_STRICT=false
      # - KC_PROXY=none
      # - KC_HTTP_ENABLED=true
      # - KC_HTTP_RELATIVE_PATH=/auth
    volumes:
      - ./compose_files/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./compose_files/keycloak/healthcheck.sh:/healthcheck.sh:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entryPoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=${APP_PORT:-8081}"
    networks:
      - cwmsdb_net

  traefik:
    container_name: traefik
    image: "traefik:v3.6.2"
    ports:
      - "${APP_PORT:-8081}:80"
    expose:
      - "8080"
    healthcheck:
      test: traefik healthcheck --ping
      interval: 5s
      timeout: 1s
      retries: 20
      start_period: 10s
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--ping"
      - "--log.level=DEBUG"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik.service=api@internal"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cwmsdb_net
